name: Recover and rebuild GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment and request a fresh build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2026-03-10"
          )

          latest="$(curl -fsSL "${headers[@]}" "${api}/pages/builds/latest")"
          status="$(jq -r '.status // empty' <<<"${latest}")"
          commit="$(jq -r '.commit // empty' <<<"${latest}")"
          echo "Latest Pages build: status=${status}, commit=${commit}"

          if [[ -n "${commit}" && ( "${status}" == "building" || "${status}" == "queued" ) ]]; then
            echo "Attempting to cancel stale Pages deployment ${commit}"
            curl -sS -o /tmp/cancel-response -w '%{http_code}' \
              -X POST "${headers[@]}" \
              "${api}/pages/deployments/${commit}/cancel" | tee /tmp/cancel-code
            echo
            cat /tmp/cancel-response || true
          fi

          echo "Requesting a fresh Pages build from the latest default-branch revision"
          curl -fsSL -X POST "${headers[@]}" "${api}/pages/builds"
          echo

          for attempt in $(seq 1 36); do
            sleep 10
            latest="$(curl -fsSL "${headers[@]}" "${api}/pages/builds/latest")"
            status="$(jq -r '.status // empty' <<<"${latest}")"
            commit="$(jq -r '.commit // empty' <<<"${latest}")"
            error="$(jq -r '.error.message // empty' <<<"${latest}")"
            echo "Check ${attempt}: status=${status}, commit=${commit}, error=${error}"

            if [[ "${status}" == "built" ]]; then
              exit 0
            fi
            if [[ "${status}" == "errored" ]]; then
              exit 1
            fi
          done

          echo "Pages build did not finish within six minutes."
          exit 1
