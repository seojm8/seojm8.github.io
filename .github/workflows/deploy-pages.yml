name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Pages from legacy branch builds to Actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          latest="$(curl -fsSL "${headers[@]}" "${api}/pages/builds/latest" || true)"
          status="$(jq -r '.status // empty' <<<"${latest:-{}}")"
          commit="$(jq -r '.commit // empty' <<<"${latest:-{}}")"

          if [[ -n "${commit}" && ( "${status}" == "building" || "${status}" == "queued" ) ]]; then
            echo "Cancelling stale legacy Pages build for ${commit}"
            curl -fsSL -X POST "${headers[@]}" \
              "${api}/pages/deployments/${commit}/cancel" \
              -o /dev/null
          fi

          echo "Changing Pages build type to workflow"
          curl -fsSL -X PUT "${headers[@]}" \
            -H "Content-Type: application/json" \
            "${api}/pages" \
            -d '{"build_type":"workflow"}' \
            -o /tmp/pages-update.json
          cat /tmp/pages-update.json

          build_type="$(curl -fsSL "${headers[@]}" "${api}/pages" | jq -r '.build_type')"
          test "${build_type}" = "workflow"

  deploy:
    needs: configure
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/profile-photo.jpg _site/assets/profile-photo.jpg
          touch _site/.nojekyll

      - name: Verify profile photo is included
        run: |
          grep -q 'assets/profile-photo.jpg' _site/index.html
          test -s _site/assets/profile-photo.jpg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
