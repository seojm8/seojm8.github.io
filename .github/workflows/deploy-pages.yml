name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

jobs:
  clear-stale-build:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the legacy Pages build blocking deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          latest="$(curl -fsSL "${headers[@]}" "${api}/pages/builds/latest")"
          status="$(jq -r '.status // empty' <<<"${latest}")"
          commit="$(jq -r '.commit // empty' <<<"${latest}")"
          echo "Latest legacy build: status=${status}, commit=${commit}"

          if [[ -n "${commit}" && ( "${status}" == "building" || "${status}" == "queued" ) ]]; then
            curl -fsSL -X POST "${headers[@]}" \
              "${api}/pages/deployments/${commit}/cancel" \
              -o /dev/null
            echo "Cancelled legacy build ${commit}"
          fi

          runs="$(curl -fsSL "${headers[@]}" "${api}/actions/workflows/deploy-pages.yml/runs?status=in_progress&per_page=20")"
          jq -r --arg current "${CURRENT_RUN_ID}" '.workflow_runs[] | select((.id|tostring) != $current) | .id' <<<"${runs}" |
          while read -r run_id; do
            [[ -z "${run_id}" ]] && continue
            curl -sS -X POST "${headers[@]}" "${api}/actions/runs/${run_id}/cancel" -o /dev/null || true
            echo "Cancelled older workflow run ${run_id}"
          done

  deploy:
    needs: clear-stale-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-artifact-deployment
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/profile-photo.jpg _site/assets/profile-photo.jpg
          touch _site/.nojekyll

      - name: Verify profile photo is included
        run: |
          grep -q 'assets/profile-photo.jpg' _site/index.html
          test -s _site/assets/profile-photo.jpg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
