name: Publish website

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  clear-stale-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages and obsolete workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          latest="$(curl -fsSL "${headers[@]}" "${api}/pages/builds/latest" || true)"
          if [[ -n "${latest}" ]]; then
            status="$(jq -r '.status // empty' <<<"${latest}")"
            commit="$(jq -r '.commit // empty' <<<"${latest}")"
            if [[ -n "${commit}" && ( "${status}" == "building" || "${status}" == "queued" ) ]]; then
              curl -sS -X POST "${headers[@]}" \
                "${api}/pages/deployments/${commit}/cancel" \
                -o /dev/null || true
              echo "Cancelled stale legacy build ${commit}"
            fi
          fi

          runs="$(curl -fsSL "${headers[@]}" "${api}/actions/runs?status=in_progress&per_page=50" || true)"
          if [[ -n "${runs}" ]]; then
            jq -r '.workflow_runs[] | select(.name == "Deploy website to GitHub Pages" or .name == "Recover and rebuild GitHub Pages") | .id' <<<"${runs}" |
            while read -r run_id; do
              [[ -z "${run_id}" ]] && continue
              curl -sS -X POST "${headers[@]}" "${api}/actions/runs/${run_id}/cancel" -o /dev/null || true
              echo "Cancelled obsolete workflow run ${run_id}"
            done
          fi

  deploy:
    needs: clear-stale-builds
    environment:
      name: github-pages
      url: ${{ steps.deploy_primary.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare and verify static site
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/profile-photo.jpg _site/assets/profile-photo.jpg
          touch _site/.nojekyll
          grep -q 'assets/profile-photo.jpg' _site/index.html
          test -s _site/assets/profile-photo.jpg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy_primary
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deployment retry
        if: steps.deploy_primary.outcome == 'failure'
        run: sleep 60

      - name: Retry direct deployment
        id: deploy_retry
        if: steps.deploy_primary.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Fall back to branch-based Pages build
        if: steps.deploy_primary.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/pages/builds"
          echo
          echo "Queued a fresh legacy Pages build as fallback."
